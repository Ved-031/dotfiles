# ============================================================
# HYPRLOCK
# ============================================================

# ------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------

general {
    hide_cursor = true

    grace = 0

    no_fade_in = false
    no_fade_out = false

    disable_loading_bar = false
}


# ------------------------------------------------------------
# ANIMATIONS
# ------------------------------------------------------------

animations {
    enabled = true
}

bezier = lockEase, 0.16, 1.0, 0.3, 1.0

animation = fadeIn, 1, 2.0, lockEase
animation = fadeOut, 1, 2.0, lockEase


# ------------------------------------------------------------
# BACKGROUND
# ------------------------------------------------------------

# Uses a screenshot of the current desktop and blurs it.

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8

    brightness = 0.55
    contrast = 0.90
    vibrancy = 0.15

    noise = 0.02
}


# ------------------------------------------------------------
# AVATAR
# ------------------------------------------------------------

image {
    monitor =

    path = /home/ved/.config/hypr/avatar.png

    size = 130
    rounding = -1

    border_size = 3
    border_color = rgba(ffffffff)

    position = 0, 185

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.55)
}


# ------------------------------------------------------------
# USERNAME
# ------------------------------------------------------------

label {
    monitor =

    text = $USER

    color = rgba(255,255,255,0.95)

    font_size = 20
    font_family = JetBrains Mono Nerd Font

    position = 0, 95

    halign = center
    valign = center
}


# ------------------------------------------------------------
# TIME
# ------------------------------------------------------------

label {
    monitor =

    text = $TIME12

    color = rgba(255,255,255,0.96)

    font_size = 72
    font_family = JetBrains Mono Nerd Font

    position = 0, -165

    halign = center
    valign = center
}


# ------------------------------------------------------------
# DATE
# ------------------------------------------------------------

label {
    monitor =

    text = cmd[update:60000] date "+%A, %d %B"

    color = rgba(255,255,255,0.65)

    font_size = 19
    font_family = JetBrains Mono Nerd Font

    position = 0, -82

    halign = center
    valign = center
}


# ------------------------------------------------------------
# PASSWORD INPUT
# ------------------------------------------------------------

input-field {
    monitor =

    size = 340, 58

    outline_thickness = 2

    outer_color = rgba(33ccffee)
    inner_color = rgba(15,15,20,0.72)

    font_color = rgba(255,255,255,1)

    dots_size = 0.25
    dots_spacing = 0.22
    dots_center = true

    fade_on_empty = false

    rounding = 18

    placeholder_text = <span foreground="##aaaaaa">Enter password</span>
    placeholder_font_family = JetBrains Mono Nerd Font

    hide_input = false

    position = 0, -5

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.45)
}
