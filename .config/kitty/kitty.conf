
# ------------------------------------------------------------
# FONT
# ------------------------------------------------------------

font_family JetBrains Mono Nerd Font
bold_font JetBrains Mono Nerd Font
italic_font JetBrains Mono Nerd Font
bold_italic_font JetBrains Mono Nerd Font

font_size 12


# ------------------------------------------------------------
# WINDOW
# ------------------------------------------------------------

# Catppuccin Mocha background
background #1e1e2e
foreground #cdd6f4

# Konsole profile opacity = 0.95
background_opacity 0.95

window_padding_width 12

hide_window_decorations yes

confirm_os_window_close 0


# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

cursor #cdd6f4
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# ------------------------------------------------------------
# SELECTION
# ------------------------------------------------------------

selection_foreground #1e1e2e
selection_background #89b4fa


# ------------------------------------------------------------
# URL
# ------------------------------------------------------------

url_color #89b4fa
url_style curly


# ------------------------------------------------------------
# CATPPUCCIN MOCHA COLORS
# ------------------------------------------------------------

# Color 0 - Black
color0 #6c7086

# Color 1 - Red
color1 #f38ba8

# Color 2 - Green
color2 #a6e3a1

# Color 3 - Yellow
color3 #f9e2af

# Color 4 - Blue
color4 #89b4fa

# Color 5 - Magenta
color5 #cba6f7

# Color 6 - Cyan
color6 #89dceb

# Color 7 - White
color7 #cdd6f4


# Bright colors

color8  #6c7086
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #89dceb
color15 #cdd6f4


# ------------------------------------------------------------
# TAB BAR
# ------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style powerline

tab_powerline_style slanted

active_tab_foreground #cdd6f4
active_tab_background #313244

inactive_tab_foreground #6c7086
inactive_tab_background #1e1e2e

tab_title_template "{index}: {title}"


# ------------------------------------------------------------
# SCROLLBACK
# ------------------------------------------------------------

scrollback_lines 10000


# ------------------------------------------------------------
# MOUSE
# ------------------------------------------------------------

mouse_hide_wait 3


# ------------------------------------------------------------
# PERFORMANCE
# ------------------------------------------------------------

repaint_delay 10
input_delay 3
sync_to_monitor yes
